#--- Config NEAT para Bibitinhos: 20 inputs, 4 outputs, feedforward, Geracao 0 conectada ---
# Contrato de I/O (ver docstring de rtneat_wrapper.py):
#   inputs 0-8   = 9 cones visuais (Visual_Sectors)
#   input 9      = Energy_Level
#   input 10     = Age_Degradation
#   input 11     = Hormonal_Level
#   input 12     = Biological_Clock
#   input 13     = Load_Sensor
#   inputs 14-15 = Kinetic_Feedback (2 canais: linear, angular)
#   inputs 16-19 = Wall_Proximity (4 canais: Norte, Sul, Oeste, Leste) — BIT-38
#   output 0     = Motor_Forward
#   output 1     = Motor_Torque
#   output 2     = Action_Grab_Drop
#   output 3     = Action_Mate
#
# pop_size/fitness_*/stagnation/elitism sao exigidos pelo parser da 0.92 mas
# irrelevantes para o rtNEAT organico deste projeto: nao usamos neat.Population.run();
# crossover/mutacao sao disparados manualmente por colisao fisica (ver rtneat_wrapper.py).

[NEAT]
fitness_criterion     = max
fitness_threshold     = 1000.0
pop_size              = 50
reset_on_extinction   = True

[DefaultGenome]
# --- topologia ---
num_inputs              = 20
num_outputs              = 4
num_hidden               = 2
feed_forward              = True
# full_direct + num_hidden=2 => Geracao 0: 20x6 input->{output,hidden} + 2x4 hidden->output = 128
initial_connection      = full_direct

# --- compatibilidade / especiacao ---
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

# --- probabilidades de mutacao estrutural ---
conn_add_prob           = 0.5
conn_delete_prob        = 0.2
node_add_prob           = 0.2
node_delete_prob        = 0.1
single_structural_mutation = False
structural_mutation_surer  = default

# --- node: bias ---
bias_init_mean          = 0.0
bias_init_stdev         = 1.0
bias_max_value          = 30.0
bias_min_value          = -30.0
bias_mutate_power       = 0.5
bias_mutate_rate        = 0.7
bias_replace_rate       = 0.1

# --- node: response ---
response_init_mean      = 1.0
response_init_stdev     = 0.0
response_max_value      = 30.0
response_min_value      = -30.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0

# --- node: activation ---
activation_default      = tanh
activation_mutate_rate  = 0.05
activation_options      = tanh sigmoid relu

# --- node: aggregation ---
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum

# --- connection: weight ---
weight_init_mean        = 0.0
weight_init_stdev       = 1.0
weight_max_value        = 30.0
weight_min_value        = -30.0
weight_mutate_power     = 0.5
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.1

# --- connection: enabled ---
enabled_default         = True
enabled_mutate_rate     = 0.01

[DefaultSpeciesSet]
compatibility_threshold = 3.0

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 20
species_elitism      = 2

[DefaultReproduction]
elitism            = 2
survival_threshold = 0.2
min_species_size   = 2
